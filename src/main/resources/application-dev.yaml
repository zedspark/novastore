spring:
  application:
    name: shopease
  # ---------- Datasource (PostgreSQL) ----------
  datasource:
    url: jdbc:postgresql://localhost:5432/novastore
    password: postgres
    username: postgres
    driver-class-name: org.postgresql.Driver
  # ---------- Flyway ----------
  flyway:
    enabled: true
    locations: [ 'classpath:db/migration' ]
    baseline-on-migrate: true
    clean-disabled: true # for safety
  # ---------- JPA / Hibernate ----------
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true


# values:
app:
  jwt:
    secret: your-256-bit-base64-encoded-secret-here
    expiration-ms: 86400000  # 24h

