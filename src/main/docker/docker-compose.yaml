# ─────────────────────────────────────────────
# docker-compose.yml  —  LOCAL DEVELOPMENT
# Usage: docker compose up --build
# ─────────────────────────────────────────────

name: novastore

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder          # Use the build stage so you get hot-reload via mounted src
    command: ./mvnw spring-boot:run -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    volumes:
      - .:/app                 # Mount source for live reload
      - maven-cache:/root/.m2  # Persist Maven cache between restarts
    ports:
      - "8080:8080"            # HTTP
      - "5005:5005"            # Remote debug port
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-myapp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-myapp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
      POSTGRES_USER: ${POSTGRES_USER:-myapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"            # Exposed so you can connect from IntelliJ/DBeaver
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myapp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --save 20 1 --loglevel warning
    ports:
      - "6379:6379"            # Exposed for local inspection (redis-cli, RedisInsight)
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  maven-cache:

networks:
  backend:
    driver: bridge